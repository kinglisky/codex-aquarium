name: 发布插件

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出版本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: 设置 pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 校验版本
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const files = ['package.json', '.codex-plugin/plugin.json'];
          const [project, plugin] = await Promise.all(files.map(async (file) =>
            JSON.parse(await readFile(file, 'utf8'))));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${project.version}` || project.version !== plugin.version) {
            throw new Error(`标签 ${tag} 与项目版本 ${project.version}、插件版本 ${plugin.version} 不一致`);
          }
          NODE

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 测试、构建并打包
        run: pnpm package

      - name: 校验发行附件
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: 发布 GitHub raw 文件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/contents/$GITHUB_REF_NAME/SHA256SUMS?ref=distribution" > /dev/null; then
            echo "$GITHUB_REF_NAME raw 文件已发布，保留原有文件。"
            exit 0
          fi
          pnpm publish:distribution

      - name: 发布 Codex 插件市场来源
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm publish:marketplace
